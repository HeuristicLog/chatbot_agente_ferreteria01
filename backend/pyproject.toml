[project]
name = "chatbot-api"
version = "0.1.0"
description = "FastAPI Backend for Ferreteria Castor Chatbot"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.28.0",
    "redis>=4.6.0",
    "qdrant-client>=1.3.0",
    "httpx>=0.24.1",
    "python-multipart>=0.0.6",
    "pytest>=7.3.1",
    "pytest-asyncio>=0.21.0"
]

[tool.setuptools]
packages = ["app"]
